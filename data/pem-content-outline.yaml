# ABP Pediatric Emergency Medicine Content Outline
# Source: The American Board of Pediatrics, "Pediatric Emergency Medicine Content Outline",
#         effective for certifying examinations administered April 1, 2021 and after.
#
# Structure:
#   domains[]           — 13 content domains, in ABP order
#     id                — domain number (1-13)
#     slug              — used in Anki deck names ("PEM Boards::01 Emergency Conditions")
#                         and tags (pem::outline::<domain-slug>::<subdomain-slug>)
#     weight            — percent of exam questions (domain weights sum to 100)
#     universal_tasks   — whether questions in this domain are also classified by universal task
#     subdomains[]      — lettered subdomains; Domain 1's carry their own weights (sum to 32.5)
#       topics[]        — numbered topics; entries are either plain strings or
#                         {name, subtopics: [...]} for topics with lettered subtopics
#
# Tagging convention used by all pemstudy skills:
#   pem::outline::01-emergency-conditions::h-infectious-disease
#   (domain slug :: subdomain slug; topic/subtopic detail goes in the note's Outline field)

meta:
  title: Pediatric Emergency Medicine Content Outline
  publisher: The American Board of Pediatrics
  effective: "2021-04-01"

universal_tasks:
  - id: 1
    name: Core Science
    weight: 20.0
    description: >-
      Integrate the clinically supportive sciences in pediatric emergency medicine,
      taking into account normal and abnormal function of the body and mind in an
      age-specific context.
  - id: 2
    name: Diagnosis
    weight: 40.0
    description: >-
      Use available information (i.e., patient history, physical examination,
      epidemiology) to assess acuity and formulate a differential diagnosis, select
      diagnostic testing, and interpret test results and response to therapies.
  - id: 3
    name: Patient Management
    weight: 40.0
    description: >-
      Develop and implement a plan of care, including intervention, reevaluation,
      consultation, and disposition.

