      - letter: B
        name: Inflammatory conditions
        slug: b-inflammatory-conditions
        description: >-
          Identify, evaluate, and manage gastrointestinal inflammatory conditions
          (eg, inflammatory bowel disease, appendicitis, pancreatitis).
      - letter: C
        name: Bleeding conditions
        slug: c-bleeding-conditions
        description: >-
          Identify, evaluate, and manage gastrointestinal bleeding conditions (eg,
          Meckel diverticulum, gastrointestinal bleed, gastritis, rectal prolapse).
      - letter: D
        name: Jaundice and biliary tract conditions
        slug: d-jaundice-biliary-tract
        description: >-
          Identify, evaluate, and manage gastrointestinal jaundice and biliary tract
          conditions (eg, cholangitis, hepatitis, cirrhosis, jaundice).

  - id: 14
    name: Neurologic/Neurosurgical
    slug: 14-neurologic-neurosurgical
    weight: 3
    subdomains:
      - letter: A
        name: Seizures
        slug: a-seizures
        description: >-
          Identify, evaluate, and manage seizures (eg, status epilepticus, febrile
          and afebrile, psychogenic non-epileptic seizure).
      - letter: B
        name: Intracranial conditions
        slug: b-intracranial-conditions
        description: >-
          Identify, evaluate, and manage intracranial conditions (eg, headaches,
