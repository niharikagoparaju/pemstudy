      - letter: D
        name: Hydrocephalus and related complications
        slug: d-hydrocephalus-complications
        description: >-
          Identify, evaluate, and manage hydrocephalus and related complications,
          including ventricular shunt malfunction.

  - id: 15
    name: Environmental Emergencies
    slug: 15-environmental-emergencies
    weight: 3
    subdomains:
      - letter: A
        name: Altitude-related illnesses and hyperbaric emergencies
        slug: a-altitude-hyperbaric
        description: >-
          Identify, evaluate, and manage altitude-related illnesses and hyperbaric
          emergencies.
      - letter: B
        name: Animal and human bites
        slug: b-animal-human-bites
        description: >-
          Identify, evaluate, and manage animal and human bites.
      - letter: C
        name: Envenomations, bites, and stings
        slug: c-envenomations-bites-stings
        description: >-
          Identify, evaluate, and manage envenomations, bites, and stings.
      - letter: D
        name: Submersion injury
        slug: d-submersion-injury
        description: >-
          Identify, evaluate, and manage submersion injuries.
      - letter: E
        name: Electrical injuries and lightning exposure
        slug: e-electrical-lightning
        description: >-
          Identify, evaluate, and manage electrical injuries and lightning exposure.
      - letter: F
        name: Heat-related conditions
        slug: f-heat-related
        description: >-
          Identify, evaluate, and manage heat-related conditions.
      - letter: G
        name: Cold-related conditions
        slug: g-cold-related
        description: >-
          Identify, evaluate, and manage cold-related conditions.

  - id: 16
    name: Allergic, Rheumatologic, Immunologic
    slug: 16-allergic-rheumatologic-immunologic
    weight: 2
    subdomains:
      - letter: A
        name: Allergic conditions
        slug: a-allergic-conditions
        description: >-
          Identify, evaluate, and manage allergic conditions (eg, anaphylaxis,
