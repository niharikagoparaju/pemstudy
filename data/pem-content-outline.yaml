# ABP Pediatric Emergency Medicine Content Outline (2027 revision)
# Source: The American Board of Pediatrics, "Pediatric Emergency Medicine Content
#         Outline — In-Training, Initial Certification, and Maintenance of
#         Certification Exams", effective for all examinations administered
#         April 1, 2027, and after. Approved by the PEM Subboard December 2025.
#
# The prior (2021) outline — 13 domains with universal tasks — is preserved in git
# history if anyone needs it for exams administered before April 2027.
#
# Structure:
#   domains[]           — 28 content domains, in ABP order, flat weights (sum = 100)
#     id                — domain number (1-28)
#     slug              — used in Anki deck names ("PEM Boards::01 Trauma")
#                         and tags (pem::outline::<domain-slug>::<subdomain-slug>)
#     weight            — percent of exam questions
#     subdomains[]      — lettered subdomains, each with the ABP competency
#                         description; a few carry numbered `topics`
#
# Tagging convention used by all pemstudy skills:
#   pem::outline::01-trauma::e-head-brain-injuries
#   (domain slug :: subdomain slug; topic detail goes in the note's Outline field)

meta:
  title: Pediatric Emergency Medicine Content Outline
  publisher: The American Board of Pediatrics
  effective: "2027-04-01"
  approved: "2025-12"
  note: >-
    28 flat-weighted content domains. Unlike the 2021 outline there are no
    universal-task classifications and no per-subdomain weights.

domains:
  - id: 1
    name: Trauma
    slug: 01-trauma
    weight: 17
    subdomains:
      - letter: A
        name: Trauma resuscitation
        slug: a-trauma-resuscitation
        description: >-
          Understand and apply the principles and procedures of trauma resuscitation,
          including rapid assessment, stabilization, and management of
          life-threatening injuries and hemorrhagic shock.
      - letter: B
        name: Multisystem trauma
        slug: b-multisystem-trauma
        description: >-
          Identify, evaluate, and manage multisystem trauma, including prioritization
          of life-threatening injuries, coordination of resuscitative efforts, and
          transition to definitive care.
      - letter: C
        name: Chest trauma
        slug: c-chest-trauma
        description: >-
          Identify, evaluate, and manage blunt and penetrating chest trauma.
      - letter: D
        name: Abdominal/pelvic and genitourinary trauma
        slug: d-abdominal-pelvic-gu-trauma
        description: >-
          Identify, evaluate, and manage blunt and penetrating abdominal/pelvic and
          genitourinary trauma.
      - letter: E
        name: Head and brain injuries
        slug: e-head-brain-injuries
        description: >-
          Identify, evaluate, and manage head and brain injuries, including
          concussions.
      - letter: F
        name: Spine and spinal cord injuries
        slug: f-spine-spinal-cord-injuries
        description: >-
          Identify, evaluate, and manage spine and spinal cord injuries, including
          neurogenic shock.
      - letter: G
        name: Neck, oral, and maxillofacial injuries
        slug: g-neck-oral-maxillofacial-injuries
        description: >-
          Identify, evaluate, and manage blunt and penetrating neck, oral, and
          maxillofacial injuries.
      - letter: H
        name: Musculoskeletal injuries
        slug: h-musculoskeletal-injuries
        description: >-
          Identify, evaluate, and manage blunt and penetrating musculoskeletal
          injuries.
      - letter: I
        name: Ophthalmologic injuries
        slug: i-ophthalmologic-injuries
        description: >-
          Identify, evaluate, and manage blunt and penetrating ophthalmologic
          injuries.
      - letter: J
        name: Burns and wounds
        slug: j-burns-wounds
        description: >-
          Identify, evaluate, and manage burns and wounds.
      - letter: K
        name: Injury prevention
        slug: k-injury-prevention
        description: >-
          Understand and apply principles of injury prevention, including risk
          assessment and counseling families.

  - id: 2
    name: Resuscitation
    slug: 02-resuscitation
    weight: 10
    subdomains:
      - letter: A
        name: Hypovolemic shock
        slug: a-hypovolemic-shock
        description: >-
          Identify, evaluate, and manage hypovolemic shock.
      - letter: B
        name: Distributive shock
        slug: b-distributive-shock
        description: >-
          Identify, evaluate, and manage distributive shock (eg, septic shock,
          anaphylactic shock).
      - letter: C
        name: Cardiogenic or obstructive shock
        slug: c-cardiogenic-obstructive-shock
        description: >-
          Identify, evaluate, and manage cardiogenic or obstructive shock.
      - letter: D
        name: Cardiopulmonary arrest
        slug: d-cardiopulmonary-arrest
        description: >-
          Identify, evaluate, and manage cardiopulmonary arrest, including CPR
          initiation and post-resuscitation care.
      - letter: E
        name: Respiratory distress/failure/arrest
        slug: e-respiratory-distress-failure-arrest
        description: >-
          Identify, evaluate, and manage respiratory distress/failure/arrest,
          including airway positioning, non-invasive airway support,
          nasopharyngeal/oral airways, and high-flow nasal cannula airway.
      - letter: F
        name: Syncope and loss of consciousness
        slug: f-syncope-loss-of-consciousness
        description: >-
          Identify, evaluate, and manage syncope and loss of consciousness,
          including brief resolved unexplained events.

  - id: 3
    name: Infectious Diseases
    slug: 03-infectious-diseases
    weight: 8
    subdomains:
      - letter: A
        name: Systemic bacterial infections
        slug: a-systemic-bacterial-infections
        description: >-
          Identify, evaluate, and manage systemic bacterial infections (eg, sepsis,
          bacteremia, meningococcemia).
      - letter: B
        name: Systemic viral infections
        slug: b-systemic-viral-infections
        description: >-
          Identify, evaluate, and manage systemic viral infections (eg, enterovirus,
          herpes, measles, mumps, rubella, varicella, roseola, HIV infection/AIDS,
          rabies, parvovirus, influenza, respiratory syncytial virus, COVID-19,
          Epstein-Barr virus), including isolation precautions.
      - letter: C
        name: Head, neck, central nervous system, and ophthalmologic infections
        slug: c-head-neck-cns-eye-infections
        description: >-
          Identify, evaluate, and manage infections affecting the head and neck
          (eg, peritonsillar abscess, retropharyngeal abscess, Potts puffy tumor,
          mastoiditis, otitis media, otitis externa, lymphadenitis, dental abscess,
          tracheitis, epiglottitis, parotitis), the central nervous system
          (eg, encephalitis, meningitis, brain abscess), and eyes (eg, orbital
          cellulitis, herpes keratitis), including specialty service consultation.
      - letter: D
        name: Cardiac infections
        slug: d-cardiac-infections
        description: >-
          Identify, evaluate, and manage cardiac infections (eg, endocarditis,
          myocarditis, pericarditis), including specialty service consultation.
      - letter: E
        name: Respiratory infections
        slug: e-respiratory-infections
        description: >-
          Identify, evaluate, and manage respiratory infections (eg, pneumonia,
          bronchiolitis, pertussis, croup, tuberculosis, empyema), including
          isolation precautions.
      - letter: F
        name: Gastrointestinal infections
        slug: f-gastrointestinal-infections
        description: >-
          Identify, evaluate, and manage gastrointestinal infections (eg, hepatitis,
          pancreatitis, perianal/perirectal abscess, cholangitis, infectious colitis,
          diarrheal illnesses, infant botulism), including isolation precautions.
      - letter: G
        name: Skin/soft tissue and musculoskeletal infections
        slug: g-skin-soft-tissue-msk-infections
        description: >-
          Identify, evaluate, and manage skin and soft tissue infections (eg,
          cellulitis, abscess, impetigo, necrotizing fasciitis, omphalitis,
          staphylococcal scalded skin syndrome) and musculoskeletal infections (eg,
          osteomyelitis, septic arthritis, myositis, discitis, flexor tenosynovitis),
          including isolation precautions.
      - letter: H
        name: Urologic and sexually transmitted infections
        slug: h-urologic-sti
        description: >-
          Identify, evaluate, and manage urologic infections (eg, urinary tract
          infection) and sexually transmitted infections, including providing
          psychosocial support and safeguarding confidentiality.
      - letter: I
        name: Vector-borne and travel-related infections
        slug: i-vector-borne-travel-infections
        description: >-
          Identify, evaluate, and manage vector-borne infections (eg, Lyme disease,
          Rocky Mountain spotted fever, malaria) and travel-related infections.

  - id: 4
    name: Procedures
    slug: 04-procedures
    weight: 5
    subdomains:
      - letter: A
        name: Airway procedures
        slug: a-airway-procedures
        topics:
          - name: Endotracheal intubation
            description: >-
              Understand endotracheal intubation, including indications, preparation
              steps, contraindications, alternatives, risks, benefits, and potential
              complications.
          - name: Rapid sequence intubation
            description: >-
              Understand medication usage in rapid sequence intubation, including
              indications, preparation steps, contraindications, alternatives,
              risks, benefits, and potential complications.
          - name: Basic and advanced airway techniques
            description: >-
              Identify, evaluate, and manage a difficult or failed airway using a
              stepwise approach, including the selection and use of basic and
              advanced airway techniques (eg, bag mask ventilation, supraglottic
              airway, nasotracheal intubation, fiberoptic intubation, tracheostomy
              tube replacement, surgical airway) and proactive anticipation and
              management of complications.
      - letter: B
        name: Breathing procedures
        slug: b-breathing-procedures
        description: >-
          Understand breathing procedures (eg, thoracentesis, thoracostomy),
          including indications, preparation steps, contraindications, alternatives,
          risks, benefits, and potential complications.
      - letter: C
        name: Circulation procedures
        slug: c-circulation-procedures
        topics:
          - name: Emergency vascular access
            description: >-
              Understand emergency vascular access, including indications,
              preparation steps, contraindications, alternatives, risks, benefits,
              and potential complications.
          - name: Defibrillation, cardioversion, cardiac pacing
            description: >-
              Understand defibrillation, cardioversion, and cardiac pacing,
              including indications, preparation steps, contraindications,
              alternatives, risks, benefits, and potential complications.
          - name: Pericardiocentesis
            description: >-
              Understand pericardiocentesis, including indications, preparation
              steps, contraindications, alternatives, risks, benefits, and potential
              complications.
      - letter: D
        name: Sedation, analgesia, and anesthesia
        slug: d-sedation-analgesia-anesthesia
        topics:
          - name: Procedural sedation/analgesia
            description: >-
              Understand procedural sedation/analgesia including indications,
              preparation steps, contraindications, risks, benefits, pharmacology,
              potential complications, and special considerations for higher risk
              patients.
          - name: Local and regional anesthesia
            description: >-
              Understand local and regional anesthesia, including indications,
              preparation steps, contraindications, alternatives, risks, benefits,
              and potential complications.
      - letter: E
        name: Point of care ultrasound
        slug: e-point-of-care-ultrasound
        topics:
          - name: eFAST
            description: >-
              Understand extended focused assessment with sonography in trauma
              (eFAST), including indications and limitations.
          - name: Cardiovascular
            description: >-
              Understand cardiovascular point of care ultrasound, including
              indications and limitations.
          - name: Skin and soft tissue
            description: >-
              Understand skin and soft tissue point-of-care ultrasound, including
              indications (eg, cellulitis, abscess, subcutaneous foreign bodies)
              and limitations.
      - letter: F
        name: Laceration repair
        slug: f-laceration-repair
        description: >-
          Understand laceration repair, including indications, alternatives, risks,
          benefits, and potential complications.
      - letter: G
        name: Incision and drainage
        slug: g-incision-drainage
        description: >-
          Understand incision and drainage, including indications, alternatives,
          risks, benefits, and potential complications.
      - letter: H
        name: Orthopedic procedures
        slug: h-orthopedic-procedures
        description: >-
          Understand orthopedic procedures (eg, arthrocentesis, joint reduction,
          radial head subluxation, fracture reduction), including indications,
          alternatives, risks, benefits, and potential complications.
      - letter: I
        name: Foreign body removal
        slug: i-foreign-body-removal
        description: >-
          Understand approaches to foreign body removal depending on foreign body
          location, including indications, alternatives, risks, benefits, and
          potential complications.
      - letter: J
        name: Gastrostomy tube replacement
        slug: j-gastrostomy-tube-replacement
        description: >-
          Understand gastrostomy tube replacement, including indications,
          alternatives, risks, benefits, and potential complications.
      - letter: K
        name: Lumbar puncture
        slug: k-lumbar-puncture
        description: >-
          Understand lumbar puncture, including indications, alternatives, risks,
          benefits, and potential complications.
      - letter: L
        name: Head and neck procedures
        slug: l-head-neck-procedures
        description: >-
          Understand head and neck procedures (eg, ear canal foreign body removal,
          auricular hematoma drainage, lateral canthotomy, nasal septal hematoma
          drainage, nose foreign body removal), including indications, alternatives,
          risks, benefits, and potential complications.

  - id: 5
    name: Special Populations
    slug: 05-special-populations
    weight: 3
    subdomains:
      - letter: A
        name: Transplant patients
        slug: a-transplant-patients
        description: >-
          Evaluate and manage transplant patients (eg, heart, lung, kidney, liver,
          bone marrow), including rejection, infection, and complications.
      - letter: B
        name: Medically and technologically complex patients
        slug: b-medically-complex-patients
        description: >-
          Evaluate and manage medically and technologically complex patients (eg,
          tracheostomy and/or ventilator dependent patients, gastrostomy dependent
          patients, genetic disorders, total parenteral nutrition dependent
          patients).
      - letter: C
        name: Adult patients
        slug: c-adult-patients
        description: >-
          Evaluate and stabilize adult patients presenting in the pediatric
          emergency department (eg, altered mental status, abdominal pain,
          cardiopulmonary arrest, chest pain, neurologic deficit, shortness of
          breath, syncope), including transfer of care.
      - letter: D
        name: Hospice and palliative care patients
        slug: d-hospice-palliative-care
        description: >-
          Evaluate and manage hospice or palliative care patients, including
          end-of-life issues and chronic pain.

  - id: 6
    name: Neonatal Conditions
    slug: 06-neonatal-conditions
    weight: 2
    subdomains:
      - letter: A
        name: Neonatal conditions
        slug: a-neonatal-conditions
        description: >-
          Identify, evaluate, and manage neonatal conditions (eg, fever, necrotizing
          enterocolitis, seizures, TORCH infections, neonatal jaundice, abnormal
          newborn screening).
      - letter: B
        name: Neonatal resuscitation
        slug: b-neonatal-resuscitation
        description: >-
          Understand and apply neonatal resuscitation principles.

  - id: 7
    name: Toxicology
    slug: 07-toxicology
    weight: 4
    subdomains:
      - letter: A
        name: Toxicology concepts
        slug: a-toxicology-concepts
        description: >-
          Identify, evaluate, and manage characteristic toxidromes, administer
          targeted antidotes, and implement appropriate decontamination strategies
          (eg, activated charcoal, irrigation) to reduce toxin absorption.
      - letter: B
        name: Medications, household agents, plants
        slug: b-medications-household-agents-plants
        description: >-
          Identify, evaluate, and manage accidental or intentional ingestions of or
          exposures to medications, household agents, or plants.
      - letter: C
        name: Substances of abuse and associated withdrawal symptoms
        slug: c-substances-of-abuse
        description: >-
          Identify, evaluate, and manage accidental or intentional ingestions of or
          exposures to substances of abuse (eg, tobacco, ethanol, marijuana),
          including the assessment and management of associated withdrawal symptoms.
      - letter: D
        name: Heavy metals, toxic alcohols, organophosphates, and other toxins
        slug: d-heavy-metals-alcohols-organophosphates
        description: >-
          Identify, evaluate, and manage accidental or intentional ingestions of or
          exposures to heavy metals, toxic alcohols, organophosphates, and other
          toxins.
      - letter: E
        name: Carbon monoxide/inhaled toxins, hydrocarbons
        slug: e-carbon-monoxide-inhaled-hydrocarbons
        description: >-
          Identify, evaluate, and manage accidental or intentional ingestions of or
          exposures to carbon monoxide/inhaled toxins, hydrocarbons.

  - id: 8
    name: Child Abuse and Maltreatment
    slug: 08-child-abuse-maltreatment
    weight: 4
    subdomains:
      - letter: A
        name: Physical abuse
        slug: a-physical-abuse
        description: >-
          Identify, evaluate, and manage patients with suspected physical abuse,
          including legal issues and reporting.
      - letter: B
        name: Sexual assault and abuse
        slug: b-sexual-assault-abuse
        description: >-
          Identify, evaluate, and manage patients with suspected sexual assault and
          abuse, including legal issues and reporting.
      - letter: C
        name: Child abuse in the medical setting
        slug: c-abuse-in-medical-setting
        description: >-
          Identify, evaluate, and manage patients with suspected child abuse in the
          medical setting, including legal issues and reporting.
      - letter: D
        name: Psychological/emotional abuse
        slug: d-psychological-emotional-abuse
        description: >-
          Identify, evaluate, and manage patients with suspected
          psychological/emotional abuse (eg, bullying, neglect, abandonment, human
          trafficking), including legal issues and reporting.

  - id: 9
    name: Behavioral Health Conditions and Psychosocial Issues
    slug: 09-behavioral-health
    weight: 3
    subdomains:
      - letter: A
        name: Acute psychiatric emergencies
        slug: a-acute-psychiatric-emergencies
        description: >-
          Identify, evaluate, and manage patients presenting with acute psychiatric
          emergencies (eg, suicidal ideation or behavior, homicidal threats, acute
          psychosis, nonsuicidal self-injury, severe agitation or aggression),
          including ensuring patient and staff safety.
      - letter: B
        name: Psychiatric disorders
        slug: b-psychiatric-disorders
        description: >-
          Identify, evaluate, and manage patients presenting with psychiatric
          disorders (eg, depression, post-traumatic stress disorder, anxiety and
          obsessive-compulsive disorder, psychosis, substance abuse and chemical
          dependence, eating disorders, somatoform disorders), including ensuring
          patient and staff safety.
      - letter: C
        name: Psychological distress
        slug: c-psychological-distress
        description: >-
          Identify, evaluate, and manage patients presenting with psychological
          distress (eg, gender dysphoria, home stressors, food insecurity,
          homelessness).
      - letter: D
        name: Neurodevelopmental disorders
        slug: d-neurodevelopmental-disorders
        description: >-
          Identify, evaluate, and manage patients presenting with neurodevelopmental
          disorders (eg, autism spectrum disorder, attention deficit-hyperactivity
          disorder, developmental delay), including ensuring patient and staff
          safety.
      - letter: E
        name: Behavioral disorders and complaints
        slug: e-behavioral-disorders-complaints
        description: >-
          Identify, evaluate, and manage patients presenting with behavioral
          disorders and complaints (eg, colic, prolonged crying, breath holding,
          hyperventilation, conduct disorder, adverse childhood events), including
          ensuring patient and staff safety.

  - id: 10
    name: Cardiovascular
    slug: 10-cardiovascular
    weight: 3
    subdomains:
      - letter: A
        name: Congenital heart disease
        slug: a-congenital-heart-disease
        description: >-
          Identify, evaluate, and manage congenital heart disease (eg, cyanotic and
          non-cyanotic defects), including surgeries and post-surgical complications.
      - letter: B
        name: Dysrhythmias and implanted cardiac devices
        slug: b-dysrhythmias-implanted-devices
        description: >-
          Identify, evaluate, and manage dysrhythmias and implanted cardiac devices
          (eg, defibrillators, pacemakers).
      - letter: C
        name: Cardiomyopathy and heart failure
        slug: c-cardiomyopathy-heart-failure
        description: >-
          Identify, evaluate, and manage cardiomyopathy and heart failure.

  - id: 11
    name: Pulmonary
    slug: 11-pulmonary
    weight: 3
    subdomains:
      - letter: A
        name: Acute asthma exacerbations
        slug: a-acute-asthma-exacerbations
        description: >-
          Identify, evaluate, and manage acute asthma exacerbations, including
          complications from asthma.
      - letter: B
        name: Acute and chronic respiratory failure
        slug: b-acute-chronic-respiratory-failure
        description: >-
          Identify, evaluate, and manage acute and chronic respiratory failure (eg,
          acute respiratory distress syndrome, ventilator dependent patient).
      - letter: C
        name: Chronic pulmonary diseases
        slug: c-chronic-pulmonary-diseases
        description: >-
          Identify, evaluate, and manage chronic pulmonary diseases (eg, chronic
          lung disease/bronchopulmonary dysplasia, congenital malformations, cystic
          fibrosis).
      - letter: D
        name: Acute pulmonary diseases
        slug: d-acute-pulmonary-diseases
        description: >-
          Identify, evaluate, and manage acute pulmonary diseases (eg, aspiration
          pneumonia, pulmonary edema, pneumothorax, pulmonary hemorrhage, pleural
          effusion, pulmonary foreign bodies, pulmonary embolism).

  - id: 12
    name: Hematologic and Oncologic
    slug: 12-hematologic-oncologic
    weight: 4
    subdomains:
      - letter: A
        name: Hematologic cell line problems
        slug: a-hematologic-cell-line-problems
        description: >-
          Identify, evaluate, and manage hematologic cell line problems (eg,
          anemias, aplastic anemia, cyclic neutropenia, immune thrombocytopenia,
          platelet disorders).
      - letter: B
        name: Leukemias and lymphomas
        slug: b-leukemias-lymphomas
        description: >-
          Identify, evaluate, and manage leukemias and lymphomas, including
          neutropenic fever and complications of chemotherapy.
      - letter: C
        name: Hemophilias and coagulation disorders
        slug: c-hemophilias-coagulation-disorders
        description: >-
          Identify, evaluate, and manage hemophilias and coagulation disorders,
          including deep vein thrombosis.
      - letter: D
        name: Solid tumors
        slug: d-solid-tumors
        description: >-
          Identify, evaluate, and manage solid tumors and their complications.
      - letter: E
        name: Blood product administration
        slug: e-blood-product-administration
        description: >-
          Manage blood product administration, including indications and
          complications.
      - letter: F
        name: Hemoglobinopathies
        slug: f-hemoglobinopathies
        description: >-
          Identify, evaluate, and manage hemoglobinopathies (eg, sickle cell
          disease, thalassemia, spherocytosis).

  - id: 13
    name: Gastrointestinal
    slug: 13-gastrointestinal
    weight: 3
    subdomains:
      - letter: A
        name: Obstructive conditions
        slug: a-obstructive-conditions
        description: >-
          Identify, evaluate, and manage gastrointestinal obstructive conditions
          (eg, pyloric stenosis, bowel obstruction, intussusception, Hirschsprung
